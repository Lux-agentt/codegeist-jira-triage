# Forge manifest — Jira Triage Agent (Codegeist 2026)
#
# STATUS: scaffold. The app id below is a PLACEHOLDER — run `forge create`
# (after the Atlassian account + free Cloud Developer License exist) and the CLI
# writes the real app id here. DO NOT deploy with the placeholder id.
# See PLAN.md §3 (modules) and §9 (open unknowns).

modules:
  rovo:agent:
    - key: triage-agent
      name: Jira Triage Agent
      description: Triages new Jira issues — classifies priority, finds duplicate
        issues, suggests an assignee from past work, and drafts a fix plan as a
        comment.
      prompt: resource:triage-prompt;agent-prompt.md
      conversationStarters:
        - Triage this issue
        - Find duplicates of this issue
        - Who should fix this issue?
        - Draft a fix plan for this issue
      actions:
        - get-issue
        - search-duplicates
        - assignee-history
        - get-project-context
        - post-triage-comment
        - set-priority
        - set-assignee
      skills:
        - triage-playbook

  rovo:skill:
    - key: triage-playbook
      source:
        dir: skills/triage-playbook
      dependencies:
        tools:
          - get-issue
          - search-duplicates
          - assignee-history
          - get-project-context
          - post-triage-comment
          - set-priority
          - set-assignee

  action:
    - key: get-issue
      name: Get Jira issue
      function: get-issue-function
      actionVerb: GET
      description: Retrieve a Jira issue by key — summary, description, status,
        priority, labels, assignee, reporter, created date, issue type and
        project.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, e.g. DEMO-123

    - key: search-duplicates
      name: Search duplicate issues
      function: search-duplicates-function
      actionVerb: GET
      description: Find issues in the same project that may duplicate the given issue.
        Extracts keywords from the issue, searches with JQL, and scores
        candidates by text overlap. Returns ranked candidates with scores — the
        agent judges which are true duplicates.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key to find duplicates for, e.g. DEMO-123
        maxResults:
          title: Max results
          type: number
          required: false
          description: Maximum duplicate candidates to return (default 10)

    - key: assignee-history
      name: Assignee history
      function: assignee-history-function
      actionVerb: GET
      description: Rank people who resolved similar issues before. Searches recently
        resolved issues in the project (same type and component when given) and
        ranks assignees by how many similar issues they resolved, weighted by
        recency. Returns the top candidates with evidence.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key, e.g. DEMO
        issueType:
          title: Issue type
          type: string
          required: false
          description: Issue type to match, e.g. Bug
        component:
          title: Component
          type: string
          required: false
          description: Component name to match, e.g. Checkout
        days:
          title: Lookback days
          type: number
          required: false
          description: How many days back to look at resolved issues (default 90)

    - key: get-project-context
      name: Get project context
      function: get-project-context-function
      actionVerb: GET
      description: Retrieve project info, the priorities available on this site (with
        their ids — call this before setting a priority), and open/resolved
        issue counts. Use it to calibrate a priority decision.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key, e.g. DEMO

    - key: post-triage-comment
      name: Post triage comment
      function: post-triage-comment-function
      actionVerb: CREATE
      description: Post the triage report as a comment on the issue. Takes the report
        as Markdown text and converts it to Jira's document format. Also saves
        the triage to the app's storage so the issue panel can display it. Only
        call after the user confirms the triage in chat — never from an
        Automation-triggered run.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key to comment on, e.g. DEMO-123
        comment:
          title: Triage report
          type: string
          required: true
          description: The triage report as Markdown text (priority, reason, duplicates,
            suggested assignee, fix plan)
        priorityName:
          title: Priority name
          type: string
          required: false
          description: The priority name from the triage report, e.g. High — shown in the
            issue panel
        assigneeName:
          title: Assignee name
          type: string
          required: false
          description: The display name of the suggested assignee, e.g. Maya — shown in
            the issue panel
        duplicateKeys:
          title: Duplicate keys
          type: string
          required: false
          description: Comma-separated keys of issues judged duplicates, e.g. DEMO-101,
            DEMO-118 — shown in the issue panel

    - key: set-priority
      name: Set issue priority
      function: set-priority-function
      actionVerb: UPDATE
      description: Set the priority of a Jira issue by priority id. Get the available
        priority ids from get-project-context first — ids vary per site. Only
        call after the user confirms the triage in chat.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, e.g. DEMO-123
        priorityId:
          title: Priority id
          type: string
          required: true
          description: The priority id from get-project-context, e.g. "2" for High

    - key: set-assignee
      name: Set issue assignee
      function: set-assignee-function
      actionVerb: UPDATE
      description: Assign a Jira issue to a person by accountId. Get the accountId
        from assignee-history first. Only call after the user confirms the
        triage in chat.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, e.g. DEMO-123
        accountId:
          title: Account id
          type: string
          required: true
          description: The Atlassian accountId of the person to assign

  jira:issuePanel:
    - key: triage-panel
      resource: main
      resolver:
        function: panel-resolver
      render: native
      title: Triage Agent

  function:
    - key: get-issue-function
      handler: src/index.getIssue
    - key: search-duplicates-function
      handler: src/index.searchDuplicates
    - key: assignee-history-function
      handler: src/index.assigneeHistory
    - key: get-project-context-function
      handler: src/index.getProjectContext
    - key: post-triage-comment-function
      handler: src/index.postTriageComment
    - key: set-priority-function
      handler: src/index.setPriority
    - key: set-assignee-function
      handler: src/index.setAssignee
    - key: panel-resolver
      handler: src/index.handler

resources:
  - key: main
    path: src/panel/index.jsx
  - key: triage-prompt
    path: prompts

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - write:jira-work

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/b7d4d717-e338-4d4a-8083-29e86e4d07f6
